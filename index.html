<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Trang chủ | Website cá nhân</title>
<style>

body {
  margin: 0;
  min-height: 100vh;
  overflow-x: hidden;
  background: linear-gradient(to bottom, #c0f0ff 0%, #a0e9ff 50%, #ffffff 100%);
}


.wrapper {
  position: relative;
}


.container {
  max-width: 800px;
  margin: 60px auto;
  background: #ffffffcc;
  padding: 40px;
  border-radius: 15px;
  box-shadow: 0 0 15px rgba(0,0,0,0.1);
  position: relative;
  z-index: 2;
}


.tree {
  position: absolute;
  bottom: 0;
  width: 100px;
  z-index: 3;
  animation: floatTree 3s ease-in-out infinite;
}

.tree-left {
    left: 270px;
    transform: translateX(-50%);
    
}

.tree-right {
    right: 270px;
    transform: translateX(50%);
  
}

@keyframes floatTree {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-3px); }
}

.sun {
  position: absolute;
  top: 10px;
  right: 10px;
  width: 80px;
  z-index: 5;
  animation: floatSun 4s ease-in-out infinite;
  filter: drop-shadow(0 0 15px #FFD700);
}

@keyframes floatSun {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  25% { transform: translateY(-5px) rotate(5deg); }
  50% { transform: translateY(-10px) rotate(0deg); }
  75% { transform: translateY(-5px) rotate(-5deg); }
}


.cloud {
  position: absolute;
  opacity: 0.8;
  animation: moveCloud linear infinite;
}

.cloud1 { width: 180px; top: 80px; animation-duration: 40s; opacity: 0.9; filter: blur(2px);}
.cloud2 { width: 220px; top: 150px; animation-duration: 60s; opacity: 0.7; filter: blur(2px); }
.cloud3 { width: 250px; top: 50px; animation-duration: 100s; opacity: 0.6; filter: blur(2px); }

@keyframes moveCloud {
  0% { left: -300px; }
  100% { left: 100%; }
}


.title-area {
  text-align: center;
  margin-bottom: 30px;
}

.title-area h1 {
  margin: 0;
  font-size: 2.5em;
  animation: bounce 3.5s ease-in-out infinite;
}

.title-area p {
  margin: 5px 0 0 0;
}

@keyframes bounce {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}


.menu {
  display: flex;
  justify-content: center;
  gap: 20px;
  flex-wrap: wrap;
  margin-top: 20px;
}

.menu a {
  display: inline-block;
  background: #00b4d8;
  color: white;
  padding: 12px 25px;
  border-radius: 10px;
  text-decoration: none;
  font-weight: bold;
  transition: 0.3s;
}

.menu a:hover {
  background: #0077b6;
  box-shadow: 0 0 20px rgba(94,161,255,0.9), 0 0 40px rgba(104,187,255,0.8);
  transform: translateY(-3px);
}


footer {
  margin-top: 40px;
  font-size: 0.9em;
}
</style>
</head>
<body>
    
<div class="wrapper">


  <img src="img/tree1.png" class="tree tree-left" alt="Cây 1">
  <img src="img/tree2.png" class="tree tree-right" alt="Cây 2">

  
  <img src="img/may1.png" class="cloud cloud1" alt="Mây 1">
  <img src="img/may2.png" class="cloud cloud2" alt="Mây 2">
  <img src="img/may3.png" class="cloud cloud3" alt="Mây 3">


  <div class="container">
    <img src="img/sun.png" class="sun" alt="Mặt Trời">

    <div class="title-area">
      <h1>𝓣𝓱𝓲𝓮̂́𝓽 𝓚𝓮̂́ 𝓦𝓮𝓫</h1>
      <p>Mã Học Phần: COMP1802</p>
    </div>

    <div class="menu">
      <a href="hoca.html">𝓑𝓪̀𝓲 𝓗𝓸̂̀ 𝓒𝓪́</a>
      <a href="cv.html">𝓒𝓥 𝓒𝓪́ 𝓝𝓱𝓪̂𝓷</a>
      <a href="hanghoa.html">𝓗𝓪̀𝓷𝓰 𝓗𝓸́𝓪</a>
    </div>

    <footer>
      <p>© 2025 | Bài tập cá nhân <br>
      <i>Sinh Viên:</i> <b>Châu Minh Đạt</b> | 
      <i>MSSV:</i> 51.01.104.016 | 
      <i>Lớp:</i> 51.01.CNTT.C</p>

      <p style="text-align:right;"><i>Giáo Viên hướng dẫn:</i> <u>Thầy Lương Trần Hy Hiến</u></p>
    </footer>
  </div>

</div>
</body>
</html>
